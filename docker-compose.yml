services:
  app:
    build:
      context: .
      target: app
    image: english-rpg-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
    volumes:
      - ./.env:/var/www/html/.env:ro
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - levelup

  web:
    build:
      context: .
      target: web
    image: english-rpg-web:latest
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - app_storage:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      - levelup

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-levelup}
      MYSQL_USER: ${DB_USERNAME:-levelup}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - levelup

  queue:
    build:
      context: .
      target: app
    image: english-rpg-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./.env:/var/www/html/.env:ro
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    depends_on:
      app:
        condition: service_started
    networks:
      - levelup

  scheduler:
    build:
      context: .
      target: app
    image: english-rpg-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
    command: php artisan schedule:work
    volumes:
      - ./.env:/var/www/html/.env:ro
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    depends_on:
      app:
        condition: service_started
    networks:
      - levelup

volumes:
  mysql_data:
  app_storage:
  app_cache:

networks:
  levelup:
    driver: bridge
